<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cloud Radar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
#radar{background:#0f0f1a;border:2px solid #4a4a6a;border-radius:8px;max-width:95vw;max-height:95vw;display:none}
.info{color:#fff;text-align:center;margin:10px;font-size:16px}
.room{color:#0ff;font-weight:bold;font-size:24px}
.map-name{color:#8f8;font-size:14px}
.status{font-size:14px;margin-top:5px}
.ok{color:#0f0}.err{color:#f00}.wait{color:#ff0}
#roomInput{font-size:20px;padding:10px 20px;text-transform:uppercase;text-align:center;width:200px;border:2px solid #4a4a6a;border-radius:8px;background:#0f0f1a;color:#0ff}
.btn{font-size:18px;padding:10px 30px;margin:5px;border:none;border-radius:8px;cursor:pointer;color:#fff}
.btn-connect{background:#2a6a2a}.btn-connect:hover{background:#3a8a3a}
.btn-back{background:#6a4a2a}.btn-back:hover{background:#8a6a3a}
.btn-share{background:#2a4a6a}.btn-share:hover{background:#3a6a8a}
.btn-settings{background:#4a4a6a}.btn-settings:hover{background:#5a5a7a}
#joinForm{display:flex;flex-direction:column;align-items:center}
#controls{display:none;margin-top:10px}
.copied{color:#0f0;font-size:12px;margin-left:10px}
#settingsPanel{display:none;background:#0f0f1a;border:2px solid #4a4a6a;border-radius:8px;padding:15px;margin:10px;max-width:350px}
.setting-row{display:flex;align-items:center;margin:8px 0;color:#fff;font-size:14px}
.setting-row label{flex:1}
.setting-row input[type="checkbox"]{width:18px;height:18px}
.setting-row input[type="color"]{width:40px;height:25px;border:none;cursor:pointer}
.setting-row input[type="range"]{width:100px}
.setting-row select{background:#1a1a2e;color:#fff;border:1px solid #4a4a6a;padding:5px;border-radius:4px}
.setting-group{border-top:1px solid #4a4a6a;padding-top:10px;margin-top:10px}
.setting-title{color:#8f8;font-size:12px;margin-bottom:5px}
</style>
</head><body>

<div id="joinForm">
    <div class="info">Enter Room Code:</div>
    <input type="text" id="roomInput" maxlength="6" placeholder="XXXXXX">
    <button class="btn btn-connect" id="connectBtn">Connect</button>
</div>

<div class="info" id="roomInfo" style="display:none">
    Room: <span class="room" id="roomDisplay" title="Click to copy" style="cursor:pointer"></span>
    <div class="map-name" id="mapName"></div>
</div>
<canvas id="radar" width="400" height="400"></canvas>
<div class="info"><span class="status" id="status"></span></div>

<div id="controls">
    <button class="btn btn-back" id="backBtn">Back</button>
    <button class="btn btn-share" id="shareBtn">Share Link</button>
    <button class="btn btn-settings" id="settingsBtn">Settings</button>
    <span class="copied" id="copiedMsg"></span>
</div>

<div id="settingsPanel">
    <div class="setting-row">
        <label>Show Teammates</label>
        <input type="checkbox" id="showTeammates" checked>
    </div>
    <div class="setting-row">
        <label>Show Names</label>
        <input type="checkbox" id="showNames">
    </div>
    <div class="setting-row">
        <label>Name Outline</label>
        <input type="checkbox" id="nameOutline" checked>
    </div>
    <div class="setting-row">
        <label>Name Size</label>
        <input type="range" id="nameSize" min="8" max="24" value="12">
        <span id="nameSizeVal">12</span>
    </div>
    
    <div class="setting-group">
        <div class="setting-title">Colors</div>
        <div class="setting-row">
            <label>Local Player</label>
            <input type="color" id="localColor" value="#ffffff">
        </div>
        <div class="setting-row">
            <label>Teammates</label>
            <input type="color" id="teamColor" value="#00ff00">
        </div>
        <div class="setting-row">
            <label>Enemies</label>
            <input type="color" id="enemyColor" value="#ff0000">
        </div>
        <div class="setting-row">
            <label>Names</label>
            <input type="color" id="nameColor" value="#ffffff">
        </div>
    </div>
    
    <div class="setting-group">
        <div class="setting-title">View As Player</div>
        <div class="setting-row">
            <label>Select Player</label>
            <select id="localPlayerSelect">
                <option value="">Host (default)</option>
            </select>
        </div>
    </div>
</div>

<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script>
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
const joinForm = document.getElementById('joinForm');
const roomInfo = document.getElementById('roomInfo');
const roomDisplay = document.getElementById('roomDisplay');
const mapNameEl = document.getElementById('mapName');
const roomInput = document.getElementById('roomInput');
const connectBtn = document.getElementById('connectBtn');
const controls = document.getElementById('controls');
const backBtn = document.getElementById('backBtn');
const shareBtn = document.getElementById('shareBtn');
const settingsBtn = document.getElementById('settingsBtn');
const copiedMsg = document.getElementById('copiedMsg');
const settingsPanel = document.getElementById('settingsPanel');
const size = 400;

// Settings elements
const showTeammatesEl = document.getElementById('showTeammates');
const showNamesEl = document.getElementById('showNames');
const nameOutlineEl = document.getElementById('nameOutline');
const nameSizeEl = document.getElementById('nameSize');
const nameSizeValEl = document.getElementById('nameSizeVal');
const localColorEl = document.getElementById('localColor');
const teamColorEl = document.getElementById('teamColor');
const enemyColorEl = document.getElementById('enemyColor');
const nameColorEl = document.getElementById('nameColor');
const localPlayerSelectEl = document.getElementById('localPlayerSelect');

// Settings
let settings = {
    showTeammates: true,
    showNames: false,
    nameOutline: true,
    nameSize: 12,
    localColor: '#ffffff',
    teamColor: '#00ff00',
    enemyColor: '#ff0000',
    nameColor: '#ffffff',
    selectedPlayer: ''
};

// Load settings from localStorage
try {
    const saved = localStorage.getItem('cloudRadarSettings');
    if (saved) {
        Object.assign(settings, JSON.parse(saved));
        showTeammatesEl.checked = settings.showTeammates;
        showNamesEl.checked = settings.showNames;
        nameOutlineEl.checked = settings.nameOutline;
        nameSizeEl.value = settings.nameSize;
        nameSizeValEl.textContent = settings.nameSize;
        localColorEl.value = settings.localColor;
        teamColorEl.value = settings.teamColor;
        enemyColorEl.value = settings.enemyColor;
        nameColorEl.value = settings.nameColor;
    }
} catch(e) {}

// Save settings
function saveSettings() {
    settings.showTeammates = showTeammatesEl.checked;
    settings.showNames = showNamesEl.checked;
    settings.nameOutline = nameOutlineEl.checked;
    settings.nameSize = parseInt(nameSizeEl.value);
    settings.localColor = localColorEl.value;
    settings.teamColor = teamColorEl.value;
    settings.enemyColor = enemyColorEl.value;
    settings.nameColor = nameColorEl.value;
    settings.selectedPlayer = localPlayerSelectEl.value;
    localStorage.setItem('cloudRadarSettings', JSON.stringify(settings));
}

// Settings event listeners
showTeammatesEl.onchange = saveSettings;
showNamesEl.onchange = saveSettings;
nameOutlineEl.onchange = saveSettings;
nameSizeEl.oninput = function() {
    nameSizeValEl.textContent = this.value;
    saveSettings();
};
localColorEl.onchange = saveSettings;
teamColorEl.onchange = saveSettings;
enemyColorEl.onchange = saveSettings;
nameColorEl.onchange = saveSettings;
localPlayerSelectEl.onchange = saveSettings;

settingsBtn.onclick = function() {
    settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
};

// Click on room code to copy
roomDisplay.onclick = function() {
    navigator.clipboard.writeText(currentRoom).then(function() {
        copiedMsg.textContent = 'Code copied!';
        setTimeout(() => copiedMsg.textContent = '', 2000);
    }).catch(function() {
        prompt('Copy this code:', currentRoom);
    });
};

// Map images base URL (GitHub Pages)
const MAPS_URL = 'https://soleniycactus.github.io/so2-web-radar/maps/';

let client = null;
let currentRoom = '';
let currentMap = '';
let mapImage = null;
let mapImageLoaded = false;
let lastData = null;
let knownTeammates = new Map(); // name -> {x, z}

// Check URL for room code
const urlParams = new URLSearchParams(window.location.search);
const urlRoom = urlParams.get('room');
if (urlRoom && urlRoom.length === 6) {
    roomInput.value = urlRoom.toUpperCase();
    setTimeout(() => connectBtn.click(), 500);
}

connectBtn.onclick = function() {
    const room = roomInput.value.toUpperCase().trim();
    if (room.length !== 6) {
        status.textContent = 'Room code must be 6 characters';
        status.className = 'status err';
        return;
    }
    
    currentRoom = room;
    joinForm.style.display = 'none';
    roomInfo.style.display = 'block';
    roomDisplay.textContent = room;
    canvas.style.display = 'block';
    controls.style.display = 'block';
    
    history.pushState(null, '', '?room=' + room);
    connect(room);
};

backBtn.onclick = function() {
    if (client) {
        client.end();
        client = null;
    }
    currentRoom = '';
    currentMap = '';
    mapImage = null;
    mapImageLoaded = false;
    lastData = null;
    knownTeammates.clear();
    joinForm.style.display = 'flex';
    roomInfo.style.display = 'none';
    canvas.style.display = 'none';
    controls.style.display = 'none';
    settingsPanel.style.display = 'none';
    status.textContent = '';
    copiedMsg.textContent = '';
    mapNameEl.textContent = '';
    roomInput.value = '';
    localPlayerSelectEl.innerHTML = '<option value="">Host (default)</option>';
    history.pushState(null, '', window.location.pathname);
};

shareBtn.onclick = function() {
    const url = window.location.origin + window.location.pathname + '?room=' + currentRoom;
    navigator.clipboard.writeText(url).then(function() {
        copiedMsg.textContent = 'Copied!';
        setTimeout(() => copiedMsg.textContent = '', 2000);
    }).catch(function() {
        prompt('Copy this link:', url);
    });
};

roomInput.onkeypress = function(e) {
    if (e.key === 'Enter') connectBtn.click();
};

// Get base map name (remove suffixes and map variants)
function getBaseMapName(mapName) {
    let name = mapName;
    
    // First remove suffixes
    name = name
        .replace(/ 2x2$/, '')
        .replace(/Convoy$/, '')
        .replace(/_NewYear2024$/, '')
        .replace(/_NY2026$/, '');
    
    // Then remove Pixel prefix
    if (name.startsWith('Pixel')) {
        name = name.substring(5); // Remove 'Pixel' prefix
    }
    
    // Map aliases to actual map names
    if (name === 'Yards') name = 'Sandyards';
    
    return name;
}

function loadMapImage(mapName) {
    if (mapName === currentMap && mapImage) return;
    
    currentMap = mapName;
    mapImageLoaded = false;
    
    const baseName = getBaseMapName(mapName);
    const tryLoad = (name, isFallback) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
            mapImage = img;
            mapImageLoaded = true;
            mapNameEl.textContent = isFallback ? mapName + ' (' + name + ')' : mapName;
        };
        img.onerror = function() {
            if (!isFallback && name !== baseName) {
                tryLoad(baseName, true);
            } else {
                mapImageLoaded = false;
                mapNameEl.textContent = mapName + ' (no image)';
            }
        };
        img.src = MAPS_URL + name + '.png';
    };
    
    tryLoad(mapName, false);
}

function updatePlayerSelect(d) {
    // Build list of all teammates (including host)
    const players = new Map();
    
    // Add host
    if (d.ln) {
        players.set(d.ln, {x: d.lx, z: d.lz, isHost: true});
    }
    
    // Add teammates
    if (d.t && d.t.length) {
        d.t.forEach(function(tm) {
            const name = tm[2] || '';
            if (name) {
                players.set(name, {x: tm[0], z: tm[1], isHost: false});
            }
        });
    }
    
    // Update select if players changed
    const currentOptions = new Set();
    for (let opt of localPlayerSelectEl.options) {
        if (opt.value) currentOptions.add(opt.value);
    }
    
    let needsUpdate = players.size !== currentOptions.size;
    if (!needsUpdate) {
        for (let name of players.keys()) {
            if (!currentOptions.has(name)) {
                needsUpdate = true;
                break;
            }
        }
    }
    
    if (needsUpdate) {
        const selectedValue = localPlayerSelectEl.value;
        localPlayerSelectEl.innerHTML = '<option value="">Host (default)</option>';
        
        players.forEach((data, name) => {
            if (!data.isHost) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                localPlayerSelectEl.appendChild(opt);
            }
        });
        
        // Restore selection if still valid
        if (selectedValue && players.has(selectedValue)) {
            localPlayerSelectEl.value = selectedValue;
        }
    }
    
    knownTeammates = players;
}

function connect(room) {
    status.textContent = 'Connecting...';
    status.className = 'status wait';
    
    if (typeof mqtt === 'undefined') {
        status.textContent = 'MQTT library not loaded';
        status.className = 'status err';
        return;
    }
    
    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        clientId: 'radar_' + Math.random().toString(16).substr(2, 8),
        clean: true,
        connectTimeout: 5000,
        reconnectPeriod: 2000,
        keepalive: 60
    });
    
    client.on('connect', function() {
        status.textContent = 'Connected!';
        status.className = 'status ok';
        client.subscribe('radar/' + room, { qos: 0 }, function(err) {
            if (err) {
                status.textContent = 'Subscribe failed';
                status.className = 'status err';
            } else {
                status.textContent = 'Waiting for data...';
                status.className = 'status wait';
            }
        });
    });
    
    client.on('message', function(topic, message) {
        try {
            const d = JSON.parse(message.toString());
            lastData = d;
            if (d.m && d.m !== currentMap) {
                loadMapImage(d.m);
            }
            updatePlayerSelect(d);
            draw(d);
            status.textContent = 'Live';
            status.className = 'status ok';
        } catch(e) {}
    });
    
    client.on('error', function(err) {
        console.log('MQTT error:', err);
        status.textContent = 'Connection error';
        status.className = 'status err';
    });
    
    client.on('offline', function() {
        status.textContent = 'Offline';
        status.className = 'status err';
    });
    
    client.on('reconnect', function() {
        status.textContent = 'Reconnecting...';
        status.className = 'status wait';
    });
}

function draw(d) {
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, size, size);
    
    if (mapImageLoaded && mapImage) {
        ctx.drawImage(mapImage, 0, 0, size, size);
    } else {
        ctx.strokeStyle = '#3a3a5a';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(size * i / 4, 0);
            ctx.lineTo(size * i / 4, size);
            ctx.moveTo(0, size * i / 4);
            ctx.lineTo(size, size * i / 4);
            ctx.stroke();
        }
    }
    
    if (!d.v) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#666';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Waiting for match...', size / 2, size / 2);
        return;
    }
    
    // Determine local player position based on selection
    let localX = d.lx;
    let localZ = d.lz;
    let localName = d.ln || '';
    const selectedPlayer = settings.selectedPlayer;
    
    if (selectedPlayer && knownTeammates.has(selectedPlayer)) {
        const selected = knownTeammates.get(selectedPlayer);
        localX = selected.x;
        localZ = selected.z;
        localName = selectedPlayer;
    }
    
    function w2r(x, z) {
        const rx = (x - d.cx) / d.cs;
        const rz = (z - d.cz) / d.cs;
        return { x: size / 2 + rx * size / 2, y: size / 2 - rz * size / 2 };
    }
    
    const r = 6.4;
    const fontSize = settings.nameSize;
    
    function drawName(p, name, circleColor) {
        if (!settings.showNames || !name) return;
        
        ctx.font = fontSize + 'px Arial';
        ctx.textAlign = 'center';
        const textY = p.y - r - 4;
        
        if (settings.nameOutline) {
            ctx.fillStyle = '#000';
            ctx.fillText(name, p.x - 1, textY);
            ctx.fillText(name, p.x + 1, textY);
            ctx.fillText(name, p.x, textY - 1);
            ctx.fillText(name, p.x, textY + 1);
        }
        ctx.fillStyle = settings.nameColor;
        ctx.fillText(name, p.x, textY);
        
        // Restore circle color
        ctx.fillStyle = circleColor;
    }
    
    // Draw teammates
    if (settings.showTeammates && d.t && d.t.length) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        d.t.forEach(function(tm) {
            const tmName = tm[2] || '';
            // Skip if this teammate is selected as local player
            if (selectedPlayer && tmName === selectedPlayer) return;
            
            ctx.fillStyle = settings.teamColor;
            const p = w2r(tm[0], tm[1]);
            if (p.x >= 0 && p.x <= size && p.y >= 0 && p.y <= size) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                drawName(p, tmName, settings.teamColor);
            }
        });
    }
    
    // Draw host as teammate if different player selected
    if (settings.showTeammates && selectedPlayer && d.ln) {
        ctx.fillStyle = settings.teamColor;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        const p = w2r(d.lx, d.lz);
        if (p.x >= 0 && p.x <= size && p.y >= 0 && p.y <= size) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawName(p, d.ln, settings.teamColor);
        }
    }
    
    // Draw local player (selected or host)
    ctx.fillStyle = settings.localColor;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    const lp = w2r(localX, localZ);
    ctx.beginPath();
    ctx.arc(lp.x, lp.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Don't draw name for local player
    
    // Draw enemies
    ctx.strokeStyle = '#000';
    if (d.e && d.e.length) {
        d.e.forEach(function(en) {
            ctx.fillStyle = settings.enemyColor;
            const p = w2r(en[0], en[1]);
            if (p.x >= 0 && p.x <= size && p.y >= 0 && p.y <= size) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                drawName(p, en[2] || '', settings.enemyColor);
            }
        });
    }
}
</script>
</body></html>
